name: Publicar no GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      # Publica SOMENTE os arquivos que o aplicativo usa.
      # Assim anotações, senhas, chaves, capturas de tela e outros arquivos do repositório
      # não ficam acessíveis pelo endereço público do site.
      - name: Montar pasta pública (dist)
        run: |
          mkdir -p dist
          cp index.html app.js conversation.js ui.js storage.js driveSync.js gestures.js styles.css sw.js manifest.json dist/
          cp icon.png icon-192.png icon-512.png icon-512-maskable.png dist/
          cp apple-touch-icon.png apple-touch-icon-precomposed.png dist/
          cp -r img dist/
          cp .nojekyll dist/

      - name: Carregar Arquivos do Site
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Registrar a versão publicada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if ! gh release view "$version" >/dev/null 2>&1; then
            gh release create "$version" --target "$GITHUB_SHA" --title "Fale Comigo ${version}" --notes-file CHANGELOG.md
          fi
